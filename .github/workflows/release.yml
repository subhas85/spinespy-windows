name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pytest
          python -c "import mediapipe, cv2, numpy, PIL; print('deps OK')"

      - name: Run unit tests
        shell: bash
        run: pytest -v

      - name: Fetch pose model
        shell: bash
        run: |
          mkdir -p assets
          curl -L -o assets/pose_landmarker.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

      - name: PyInstaller build
        shell: bash
        run: |
          pyinstaller packaging/spinespy.spec --noconfirm --distpath dist --workpath build
          test -f "dist/SpineSpy/SpineSpy.exe" || { echo "exe missing"; exit 1; }
          du -sh dist/SpineSpy

      - name: Inno Setup compile
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpineSpy-Setup
          path: packaging/Output/SpineSpy-Setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SpineSpy ${{ github.ref_name }}
          files: packaging/Output/SpineSpy-Setup.exe
          generate_release_notes: true
